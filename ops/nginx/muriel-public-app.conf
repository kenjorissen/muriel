# Application forms enforce a 10 MiB workbook limit. Leave room for multipart
# framing so application validation, rather than Nginx, owns that boundary.
client_max_body_size 11m;
client_body_buffer_size 16k;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 15s;
send_timeout 30s;

limit_conn muriel_per_client 20;
limit_conn_status 429;
limit_req zone=muriel_public burst=60 nodelay;
limit_req_status 429;

# Django Admin is break-glass-only through the separate private Serve port.
location = /admin {
    return 404;
}

location ^~ /admin/ {
    return 404;
}

# Do not let a request for a repository or environment artifact fall
# through to the application.
location ~ /\. {
    deny all;
}

location ^~ /static/ {
    alias /srv/muriel/current/staticfiles/;
    access_log off;
    expires 7d;
    try_files $uri =404;
}

# A short, per-source budget protects credential and token acceptance
# without storing account state or making a permanent lockout.
location = /sign-in/ {
    limit_req zone=muriel_public burst=60 nodelay;
    limit_req zone=muriel_sensitive burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/run/muriel/gunicorn.sock:;
    include /etc/nginx/snippets/muriel-proxy.conf;
}

location = /password/reset/ {
    limit_req zone=muriel_public burst=60 nodelay;
    limit_req zone=muriel_sensitive burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/run/muriel/gunicorn.sock:;
    include /etc/nginx/snippets/muriel-proxy.conf;
}

location ^~ /invitation/ {
    limit_req zone=muriel_public burst=60 nodelay;
    limit_req zone=muriel_sensitive burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/run/muriel/gunicorn.sock:;
    include /etc/nginx/snippets/muriel-proxy.conf;
}

location / {
    proxy_pass http://unix:/run/muriel/gunicorn.sock:;
    include /etc/nginx/snippets/muriel-proxy.conf;
}
