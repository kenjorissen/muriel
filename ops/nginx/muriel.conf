# Tailscale Funnel is the only caller of this listener. It terminates TLS and
# writes the original peer address in PROXY protocol v2 before forwarding here.
limit_req_zone $binary_remote_addr zone=muriel_public:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=muriel_sensitive:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=muriel_per_client:10m;

# Reject an accidental or hostile Host before it can reach Django. This listener
# still requires PROXY protocol so ordinary local callers cannot forge an address.
server {
    listen 127.0.0.1:8080 proxy_protocol default_server;
    listen [::1]:8080 proxy_protocol default_server;
    server_name _;

    return 444;
}

server {
    listen 127.0.0.1:8080 proxy_protocol;
    listen [::1]:8080 proxy_protocol;
    server_name @PRODUCTION_PRIMARY_HOST@;

    # Only the Funnel connection reaches this loopback listener. Do not add
    # another trusted range: the PROXY preamble is otherwise forgeable.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;
    real_ip_recursive off;

    include /etc/nginx/snippets/muriel-public-app.conf;
}

# cloudflared is the only caller of this plain-HTTP loopback listener. Cloudflare
# overwrites CF-Connecting-IP at its edge; trust it only from the loopback peer.
server {
    listen 127.0.0.1:8083 default_server;
    listen [::1]:8083 default_server;
    server_name _;

    return 444;
}

server {
    listen 127.0.0.1:8083;
    listen [::1]:8083;
    server_name @PRODUCTION_SECONDARY_HOST@;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    include /etc/nginx/snippets/muriel-public-app.conf;
}

# This TLS listener is reached through private Tailscale Serve. It does not
# accept PROXY protocol and cannot be reached through public Funnel.
server {
    listen 127.0.0.1:8081 ssl;
    listen [::1]:8081 ssl;
    server_name @PRODUCTION_PRIMARY_HOST@;

    ssl_certificate /etc/nginx/tailscale/muriel.crt;
    ssl_certificate_key /etc/nginx/tailscale/muriel.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;

    location ^~ /static/ {
        alias /srv/muriel/current/staticfiles/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://unix:/run/muriel/gunicorn.sock:;
        include /etc/nginx/snippets/muriel-admin-proxy.conf;
    }
}
