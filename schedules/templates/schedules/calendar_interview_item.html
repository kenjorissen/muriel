{% if content.closed_label %}<p class="calendar-closed-cell" aria-label="{{ content.accessible_label }}">{{ content.closed_label }}</p>{% else %}<a class="interview-calendar-shift{% if content.finding_tone %} interview-calendar-shift--{{ content.finding_tone }}{% elif content.attention %} interview-calendar-shift--attention{% endif %}" href="{{ content.url }}"><strong>Interview AM</strong>{% if content.physician_name %}<span>{{ content.physician_name }}</span>{% endif %}{% for finding in content.findings %}<span class="interview-finding interview-finding--{{ finding.severity }}">{{ finding.message }}</span>{% endfor %}<span class="interview-edit-link">Edit</span></a>{% endif %}
