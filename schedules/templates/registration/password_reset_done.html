{% extends "schedules/base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
  <section class="panel sign-in-panel" aria-labelledby="password-reset-done-heading">
    <h1 id="password-reset-done-heading">Check your email</h1>
    <p class="sign-in-introduction">If an active account with a usable password matches that email address, reset instructions have been sent.</p>

  </section>
{% endblock %}
