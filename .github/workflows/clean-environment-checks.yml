name: Clean environment checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    name: Dependency security
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install audit dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit declared application dependencies
        run: ./scripts/security-audit

  checks:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install declared browser tooling and Chromium prerequisites
        run: ./scripts/setup-browser

      - name: Run quality checks
        run: ./scripts/quality-check

      - name: Run complete checks
        run: ./scripts/check
