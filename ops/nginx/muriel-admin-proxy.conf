# This TLS listener is reached only through the documented private Tailscale Serve route.
# Pin the browser's documented authority rather than accepting Serve headers.
proxy_http_version 1.1;
proxy_set_header Host @PRODUCTION_PRIMARY_HOST@:8443;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Muriel-Admin 1;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 65s;
proxy_request_buffering on;
