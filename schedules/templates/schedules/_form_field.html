<div class="form-field-group{% if field_classes %} {{ field_classes }}{% endif %}"{% if role_attribute %} data-role-attribute="{{ role_attribute }}"{% endif %}>{% if compact_helper %}<div class="form-field-label-with-note"><label for="{{ field.id_for_label }}">{{ field.label }}</label><small id="{{ field.auto_id }}_helptext">{{ compact_helper }}</small></div>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{% endif %}{{ field }}{{ field.errors }}{% if helper %}<small>{{ helper }}</small>{% endif %}</div>
