{% if finding %}{% if finding_url %}<a class="calendar-finding-indicator calendar-finding-indicator--{{ finding.severity }}" href="{{ finding_url }}" aria-label="{{ finding.summary }} {{ finding_action_label }}"><span aria-hidden="true">{{ finding.symbol }}</span><span class="calendar-finding-tooltip" aria-hidden="true">{% for label in finding.labels %}<span>{{ label }}</span>{% endfor %}</span></a>{% else %}<span class="calendar-finding-indicator calendar-finding-indicator--{{ finding.severity }}"{% if inside_link %} aria-hidden="true"{% else %} role="img" aria-label="{{ finding.summary }}" tabindex="0"{% endif %}><span aria-hidden="true">{{ finding.symbol }}</span><span class="calendar-finding-tooltip" aria-hidden="true">{% for label in finding.labels %}<span>{{ label }}</span>{% endfor %}</span></span>{% endif %}{% endif %}
